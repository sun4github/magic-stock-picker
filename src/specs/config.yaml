# Master Configuration for Google ADK Agent System

system:
  project_name: "Magic Formula Skeptical Decomposer Engine"
  environment: "development"
  framework: "google-adk" # Google Agent Development Kit

logging:
  console_output: true
  log_level: "INFO"
  log_directory: "logs"
  filename_pattern: "run_{timestamp}.log"

agents:
  # PINNED model for every reasoning agent — read by main.py as AGENT_MODEL.
  #
  # Deliberately NOT the `gemini-flash-latest` alias. Google repoints that alias at
  # each new Flash release; it moved to gemini-3.6-flash on its own and per-run cost
  # rose ~3.5x silently (input $0.30 -> $1.50/1M, output $2.50 -> $7.50/1M) with no
  # code change. Pinning makes a model upgrade a deliberate step: change this line,
  # add the new model's rates under llm_pricing.models, confirm them against the
  # Cloud Billing SKUs, then re-run. The per-model cost breakdown in the run log
  # will flag it immediately if the billed model ever differs from this pin.
  model: "gemini-3.6-flash"

  # The INDEPENDENT CRITIC (Phase D) may run on a different model, and there is a
  # methodological reason to want that: a reviewer sharing its target's weights
  # shares its blind spots. If Gemini misreads a disclosure a certain way, Gemini
  # reviewing Gemini tends to misread it the same way, and the review adds less than
  # its cost. A different lineage decorrelates the errors.
  #
  # Empty means "use `model` above" — the critic is on the same model as everything
  # else until this is deliberately set. Set it to a LiteLLM-style identifier to
  # point elsewhere, e.g. "ollama_chat/glm-5.2:cloud".
  #
  # Two things a replacement MUST have, both load-bearing rather than nice to have:
  #   - TOOL CALLING. The critic researches; it calls fmp_stock_news and
  #     web_search_tool, and refinement.seed_critique_usd is set higher than the
  #     reviser's precisely because of those calls.
  #   - A long context. It is sent the whole report under review plus the verified
  #     figures, the quarterly data and the accumulated critic memory.
  # A model that quietly drops tool calls will not error — it will return a clean
  # review that researched nothing, which is worse than no review.
  #
  # This does NOT change `reviser_agent`, which stays on `model` above. The reviser
  # is built from analyst_agent.instruction verbatim: it IS the analyst revising its
  # own work, and it should be held to the rules by the model that wrote it.
  #
  # Watch the run log after switching. `_check_metered` reports ZERO model calls for
  # any agent whose responses do not carry usage metadata in the Gemini shape — that
  # is the silent failure to look for, because a model whose tokens never reach the
  # accounting is a model the budget guard cannot see.
  critic_model: "ollama_chat/glm-5.2:cloud"

  screener_agent:
    name: "Magic_Formula_Screener"
    top_n_candidates: 30
    # Informational only — not read by any code path. The actual wrapped script is
    # magic_formula_starter_screener.py (see mcp_server.py's run_magic_formula_screener).
    script_path: "magic_formula_starter_screener.py"

  # NOTE: SEC 10-K and FMP metrics are gathered by DIRECT tool calls (no LLM) for
  # 100% fidelity; there are no sec/metrics LLM agents. Phase B reasoning is three
  # roles run in sequence over one shared session (bear -> bull -> neutral analyst),
  # implemented as a plain list of LlmAgents (not ADK's SequentialAgent class) so a
  # 429 can be retried at just the failed role. See agent_architecture.md §1 and §5B.

  bear_agent:
    name: "Bear_Agent"
    # model: inherited from agents.model (pinned). Kept out of the per-agent
    # blocks so there is exactly one place to change the model.
    instructions_file: "research-instructions.md"
    # Two complementary search sources (see agent_architecture.md Section 2C):
    news_provider: "fmp"                      # ticker-tagged factual news
    news_api_key_env: "FMP_API_KEY"
    search_provider: "tavily"                 # qualitative open-web (bear framing)
    search_api_key_env: "TAVILY_API_KEY"

  bull_agent:
    name: "Bull_Agent"
    # model: inherited from agents.model (pinned)
    instructions_file: "bullish-research-instructions.md"
    news_provider: "fmp"
    news_api_key_env: "FMP_API_KEY"
    search_provider: "tavily"                 # qualitative open-web (bull framing)
    search_api_key_env: "TAVILY_API_KEY"

  analyst_agent:
    name: "Analyst_Agent"                     # neutral judge (no skeptical prompt)
    # model: inherited from agents.model (pinned)
    output_format: "markdown"

  sale_advisor_agent:
    name: "Sale_Advisor_Agent"
    # model: inherited from agents.model (pinned)
    instructions_file: "sale-advisor-instructions.md"
    news_provider: "fmp"
    news_api_key_env: "FMP_API_KEY"
    search_provider: "tavily"                 # qualitative open-web (adverse events)
    search_api_key_env: "TAVILY_API_KEY"

  # On-demand sell-condition check (Phase C follow-up). A standalone single-stock
  # flow: loads the ticker's latest SALE_CASE and tests whether its conditions are
  # now met against CURRENT data, advising Sell/Hold. Not part of the analysis graph.
  sell_check_agent:
    name: "Sell_Check_Agent"
    # model: inherited from agents.model (pinned)
    news_provider: "fmp"                      # current developments (impairments, contract loss)
    news_api_key_env: "FMP_API_KEY"
    search_provider: "tavily"                 # anything not in the news feed
    search_api_key_env: "TAVILY_API_KEY"

  # Phase E: the BUY CASE, for a WATCH verdict only (src/buy_case_agent.py). Defined
  # outside main.py because it is conditional on a verdict that only exists after the
  # reasoning graph has finished — see the module docstring. It reads the finished
  # report, the verified figures, the quarterly feed and a freshly fetched price, and
  # writes the entry price range and the buy triggers that `--buy-check` tests later.
  #
  # It is the only role in the system with FORWARD-looking data: analyst consensus
  # estimates, the implied forward P/E and its analyst counts, the earnings calendar
  # for this company AND for the companies whose results drive its revenue, segment
  # disclosure, and SEC merger filings. Those feeds are deliberately kept away from
  # the bear/bull/analyst chain, which weighs realised results and may not rest a Buy
  # on a projection.
  buy_case_agent:
    name: "Buy_Case_Agent"
    # model: inherited from agents.model (pinned)
    instructions_file: "buy-case-instructions.md"
    verdicts: ["Watch"]                       # informational: the gate is is_watch()
    news_provider: "fmp"
    news_api_key_env: "FMP_API_KEY"
    search_provider: "tavily"                 # deals, spending plans, analyst commentary
    search_api_key_env: "TAVILY_API_KEY"

  # On-demand buy-condition check (Phase E follow-up), the mirror of sell_check_agent:
  # loads a stored BUY_CASE and tests whether its price range and triggers are now
  # met against CURRENT data, advising Buy/Wait. Not part of the analysis graph.
  buy_check_agent:
    name: "Buy_Check_Agent"
    # model: inherited from agents.model (pinned)
    instructions_file: "buy-check-instructions.md"
    news_provider: "fmp"
    news_api_key_env: "FMP_API_KEY"
    search_provider: "tavily"
    search_api_key_env: "TAVILY_API_KEY"

# EXPLICIT context caching (Gemini). Disabled on measured evidence — see the long
# comment above CONTEXT_CACHE in main.py.
#
# Short version: an explicit cache cannot be created from a system instruction
# alone (the API returns "contents are required"), and all our data sits in the
# agent instruction, so every ADK attempt failed silently. Moving the data into the
# first conversation message to fix that was tried and measured on FISV: cached
# share fell 32% -> 6% and cost ROSE $0.32 -> $0.43, because the stable system
# instruction was what IMPLICIT caching had been matching on all along.
#
# Implicit caching needs no configuration and currently covers ~32% of prompt
# tokens. Re-enable this only if ADK/the API gains support for caching a system
# instruction directly, and re-measure before trusting it.
context_cache:
  enabled: false
  ttl_seconds: 900        # just long enough for one ticker; storage bills per token-hour
  min_tokens: 4096        # below this, cache storage costs more than it saves
  cache_intervals: 10     # invocations reusing one cache before it is refreshed

# Spend ceilings. A 30-ticker screen is ~$11 at current rates, so a runaway loop or
# a retry storm gets expensive quickly. Checked before each ticker starts, using the
# run's accumulated cost plus what the DB shows was already spent in the window.
#
# on_exceed:
#   halt  - stop cleanly before starting the next ticker; the run is marked
#           BUDGET_EXCEEDED and everything already analyzed is kept
#   warn  - log loudly and keep going
budget:
  enabled: true
  # One pipeline run (~30 tickers at ~$0.37 each ≈ $11). Set to 20 rather than 15 to
  # leave headroom: at 15 a modest drift in per-ticker cost would trip the ceiling
  # PART-WAY through a 30-ticker run, and `on_exceed: halt` would then stop cleanly
  # with a partial candidate list — the run is not wasted, but it is short, which is
  # a worse outcome than the overspend it prevented. Still well below the ~$22 a
  # doubled per-ticker cost would reach, so a genuine runaway is still caught.
  per_run_usd: 20.00
  per_day_usd: 25.00        # rolling window below, not calendar day
  day_window_hours: 24
  on_exceed: "halt"

# Skip re-analyzing a ticker when nothing material has changed. The fingerprint
# covers the ticker, the balance-sheet date its figures came from, and a hash of
# the agent prompts — so a new filing or any prompt edit forces a fresh run.
#
# max_age_hours bounds staleness from the things the fingerprint CANNOT see: the
# agents do live news and web research, so an otherwise-identical run a week later
# would genuinely surface different information. Keep this well under a week.
# `--force` on the command line bypasses reuse entirely.
reuse:
  enabled: true
  max_age_hours: 24

# Critic refinement loop (refine.py). An INDEPENDENT critic agent — its own
# instruction file, its own news/web-search tools, no sight of the analyst's prompt —
# reviews a finished report and the analyst revises until the critic agrees or the
# money runs out. A report that never reached agreement says so on its face.
#
# Deliberately NOT part of the pipeline and not covered by budget.per_run_usd: it
# costs several times what producing the report cost, so it is run per ticker, on
# purpose, on the names you are about to act on. `--max-budget` overrides the ceiling
# for one invocation.
#
# The ceiling is enforced BETWEEN rounds. Committing to a revision commits to three
# things, priced as one: the revision, the critique that must follow it (a revision
# nobody reviewed would ship text carrying the previous round's objections, which may
# already have been fixed), and the sale advisory that revision invalidates. The
# rolling budget.per_day_usd window still applies on top of this.
refinement:
  # Raised from 2.00 to 2.25 when the sale advisory joined the revision commitment
  # (see seed_advisory_usd below), then to 2.45 when the buy case did (see
  # seed_buy_case_usd). Each reservation is held back from the review rounds, so
  # without the matching increase every addition would quietly buy fewer rounds for
  # the same stated ceiling. The number restores review headroom rather than paying
  # for the derived documents out of it.
  max_budget_usd: 2.45      # ~4-6 agent turns, plus the advisory and the buy case
  max_rounds: 3             # hard stop; the budget usually binds first
  # Cost estimates used ONLY for the first ceiling check, before either role has run
  # once and can be measured. After round 1 they are discarded in favour of the
  # measured cost x estimate_headroom, so they never affect a session that has got
  # going — they only decide whether it starts. Erring high therefore costs nothing
  # except declining a round that might just have fitted, at a very small ceiling.
  #
  # Calibrated against the first five live rounds (gemini-3.6-flash, 2026-08-01):
  #   critique  HRB $0.1242 | LLY $0.0954 | FISV r1 $0.1149 | FISV r2 $0.0707
  #   revision  FISV r1 $0.0692
  # The original guesses (0.30 / 0.20) were 2.4-3x high, which made a ceiling under
  # ~$0.35 refuse a review that actually costs ~$0.12. These sit ~20% above the
  # dearest observed round of each kind. Note only ONE revision has been measured,
  # and later-round revisions carry bigger prompts, so that one keeps more headroom.
  seed_critique_usd: 0.15   # the critic makes tool calls, so it is the dearer role
  seed_revision_usd: 0.12
  estimate_headroom: 1.25   # rounds grow as findings and replies accumulate
  # Long-term memory (critic_memory): how much of this company's review history is
  # replayed into both agents' prompts each round. Sent twice per round, so raising
  # it raises every round's cost — 25 findings is already a long history for one name.
  memory_limit: 25
  memory_max_age_days: 365

  # The sale advisory is an OUTPUT derived from the final report, not an input to
  # it, so a review that changes the report leaves the advisory describing a thesis
  # that no longer exists — and its sell triggers must be anchored to
  # VERIFIED_FIGURES, so a corrected figure can leave a threshold calibrated against
  # a number the pipeline itself now says was wrong.
  #
  # Handled by outcome, so the cost is only paid when it buys something:
  #   critic agreed with no revision -> the analyst's prose is byte-identical, so
  #       the existing advisory is exactly as valid as before. Carried forward into
  #       the refinement run unchanged, for $0.
  #   a revision ran -> re-derived against the revised report (~$0.07-0.10, measured
  #       across the 2026-08-01 runs: CRMD $0.0892, CROX $0.0824, OMC $0.0724,
  #       RIGL $0.0945).
  #
  # Carrying it forward also fixes a broken promise: the refined report stamps the
  # refinement's run_id and tells the reader to save it against their lot, but
  # `--sell-check TICKER --run <that id>` used to fail outright because no SALE_CASE
  # existed under it.
  #
  # Set false to leave the advisory untouched (the pre-2026-08 behaviour).
  regenerate_sale_advisory: true

  # The buy case (Phase E) after a review. Same problem as the advisory — it is
  # derived FROM the report, the critic never sees it, and a revision leaves its
  # triggers describing a thesis that no longer exists — with one extra wrinkle: it
  # exists only for a 'Watch', and a review can move the verdict ONTO or OFF Watch.
  # So there are four outcomes, not two (see refine._refresh_buy_case):
  #   verdict is no longer Watch -> nothing is written; the reviewed run keeps its own
  #   Watch, no buy case existed  -> one is WRITTEN (the review created the need)
  #   Watch, revision ran         -> re-derived against the revised text and today's price
  #   Watch, no revision          -> carried forward unchanged, for $0
  #
  # Carrying forward matters for the same reason it does for the advisory: the refined
  # report stamps the refinement's run_id and tells the reader to record it, and
  # `--buy-check TICKER --run <that id>` would fail outright with no BUY_CASE under it.
  #
  # Set false to leave the buy case untouched.
  regenerate_buy_case: true
  # Reserved BEFORE the loop commits to a revision, not discovered afterwards — see
  # _Estimator.full_round. A revision is what makes the advisory stale, so the two
  # are one commitment and are priced as one. The alternative, a separate pot the
  # advisory draws on, would mean the ceiling you name being quietly exceeded by
  # the advisory's ~$0.12; a ceiling that can be exceeded by design is not a ceiling. Reserving costs nothing
  # in practice (~$0.12 against rounds of ~$0.20) and only binds in a session that is
  # about to need it, since no revision has been committed to before the check.
  seed_advisory_usd: 0.12

  # Reserved on the same rule, with one difference that cannot be engineered away:
  # whether a buy case is needed depends on the verdict of a report that does not yet
  # exist when the reservation has to be made. It is therefore reserved for EVERY
  # session, and a session whose verdict lands on Buy or Avoid simply does not spend
  # it. max_budget_usd above was raised to absorb that.
  #
  # Higher than the advisory's seed because the buy-case advisor does more work: it
  # calls the forward-estimates feed, the earnings calendar for the subject AND for
  # each company it names as a leading indicator, segment disclosure, and the M&A
  # filings, where the advisor makes two tool calls. Re-calibrate this against
  # measured runs the way seed_critique_usd was.
  seed_buy_case_usd: 0.18

# The verdict ledger: what each verdict claimed, and what happened next.
#
# Purpose, in order of how soon it pays off:
#   1. Did filtering the screen beat not filtering it? Comparing the verdicts
#      against run_universe answers that with one year of data and costs nothing
#      extra to collect, because the screener already computes every figure.
#   2. Which FACTORS do we read correctly, and which do we misread? Aggregated
#      across tickers via factor_key, this reaches useful sample sizes long
#      before any company-to-company comparison could.
#   3. (Later, unbuilt.) A second verdict informed by 1 and 2.
#
# Nothing here changes a verdict today. The ledger only records.
verdict_ledger:
  enabled: true

  # Benchmark for excess return. Deliberately a broad-market index rather than a
  # sector ETF: the screen is sector-agnostic, and the question being asked is
  # "did this beat leaving the money in the market", not "did it beat its peers".
  # Changing this invalidates comparisons against everything recorded before the
  # change, so it is stored per-row (verdict_log.benchmark_symbol) as well.
  benchmark_symbol: "SPY"

  # How often the outcome job re-quotes any given subject. The cron itself also
  # runs daily now (see the crontab in cron/run_outcome_snapshot.py), so this is
  # set to match it -- every open subject gets a fresh snapshot each day, which
  # is what feeds a daily dashboard. Raise it (7 for weekly, say) if daily
  # granularity isn't needed and cutting FMP call volume matters more. Whatever
  # it's set to, a rolling interval beats fixed 30/90/180/365-day horizons: a
  # subject missed on a horizon date would lose that datapoint permanently, and
  # over a year a missed one is a certainty. The horizon marks are derived from
  # age_days at read time instead.
  snapshot_interval_days: 1
  # Verdicts are NOT age-capped: an open position (verdict_log.exit_date IS
  # NULL) is re-quoted forever, so it stays on the MST scoreboard no matter how
  # old the pick is. Sold/closed picks are excluded via exit_date and never
  # re-priced. The only age window left is for the universe control group
  # below. A daily quote per open ticker is free within the FMP subscription,
  # so tracking open positions forever costs nothing meaningful.
  track_for_days: 400

  # Value written to verdict_log.source for purchases mirrored in from the
  # position tracker by sync_external_picks.py. Must match the label used on
  # the tracker's own lots (stock_tracker.lots.source), or the sync re-enters
  # the same purchases under a second name every time it runs.
  #
  # verdict_log.source has three values in total, and only this one is
  # configurable because only this one has to agree with another application:
  #
  #   PIPELINE  - the screen chose the name and the agents analysed it. The
  #               only rows with a run_universe control group behind them,
  #               which is why Q1 counts these alone.
  #   ONDEMAND  - a one-off `main.py TICKER`. The agents analysed it, but the
  #               SCREEN never chose it, so it has no universe row and must
  #               stay out of Q1. Q2/Q3/Q4 still count it: the judgement is
  #               the system's either way. Set in code, not here.
  #   this value - not an analysis at all; a purchase made elsewhere.
  #
  # A lot carrying a run_id is matched to its analysis verdict by that run_id
  # and is NEVER mirrored, whatever the lot's own source says. A name bought
  # off a one-off run is usually recorded in the tracker as MANUAL while its
  # verdict is ONDEMAND, and mirroring it would enter one decision twice.
  external_source: "MANUAL"

  # Controlled vocabulary for verdict_basis.factor_key. The analyst picks from
  # this list; anything genuinely new is recorded as OTHER_<slug> and reviewed
  # for promotion. Free-text keys are the failure mode this exists to prevent —
  # "customer concentration", "client concentration risk" and "top-10 customer
  # exposure" are one factor written three ways, and as three keys they never
  # accumulate into a base rate.
  #
  # Seeded from critic-instructions.md's fallacy checklist and the section
  # headings of research-instructions.md / bullish-research-instructions.md, so
  # the vocabulary matches the questions the agents are already made to answer.
  factor_taxonomy:

    # -- Earnings quality and data integrity ---------------------------------
    # This group is the one that justifies an AVOID on its own terms: it says
    # the earnings that made the stock rank cheap are not real, i.e. the screen
    # received a broken input. That is a different claim from "we dislike this
    # business", and the ledger is meant to keep the two apart.
    - one_time_earnings_distortion   # gain/charge inflating or deflating the EBIT the rank used
    - accounting_restatement_risk    # restatement, late filing, auditor change, material weakness
    - going_concern_language         # explicit doubt in the filing
    - ttm_annual_divergence          # TTM and annual EBIT tell different stories
    - non_recurring_revenue          # a contract, settlement or divestiture inflating the top line
    - segment_disclosure_absent      # organic performance cannot be separated from acquired

    # -- Growth and its durability -------------------------------------------
    - organic_growth_declining
    - roll_up_acquisitive_growth     # growth bought rather than generated
    - revenue_growth_accelerating
    - margin_compression
    - margin_expansion
    - cyclical_peak_earnings         # earnings near a cycle high, so the multiple flatters
    - end_market_secular_decline

    # -- Business quality and moat -------------------------------------------
    - customer_concentration
    - supplier_concentration
    - moat_switching_costs
    - moat_brand_or_network
    - moat_absent_commodity          # no durable advantage; competes on price
    - pricing_power_demonstrated
    - competitive_intensity_rising

    # -- Balance sheet --------------------------------------------------------
    - debt_maturity_wall
    - leverage_elevated
    - net_cash_position
    - goodwill_heavy_balance_sheet
    - working_capital_deterioration
    - free_cash_flow_conversion_weak

    # -- Capital allocation ---------------------------------------------------
    - buyback_funded_by_debt
    - buyback_accretive
    - dividend_coverage_thin
    - acquisition_track_record_poor
    - reinvestment_runway_strong

    # -- Catalysts and expectations ------------------------------------------
    # The CONFIRMED/SPECULATIVE split mirrors the label the bull agent is
    # already required to attach to every catalyst it raises, so the two stay
    # in the same vocabulary and a Buy resting on a speculative catalyst is
    # visible as such in the ledger.
    - catalyst_confirmed
    - catalyst_speculative
    - guidance_cut_recent
    - expectations_already_low        # the bar the price implies is beatable
    - priced_in_asserted              # claimed without evidence — a critic checklist item

    # -- Governance, structure and external risk ------------------------------
    - insider_selling
    - insider_buying
    - controlled_or_dual_class
    - regulatory_overhang
    - litigation_material
    - customer_or_end_market_credit_risk

# Weekly sweep of every open buy case, asking "has a trigger fired yet?".
#
# Runs on the machine that hosts the agents (Windows Task Scheduler), NOT on the
# Pi that runs the ledger snapshot: this one uses ADK and Gemini.
#
# The design point is the PRE-FILTER. Running the buy-check agent on every open
# watchlist name every week costs ~$0.08 a ticker for a question whose answer is
# "not yet" almost every time, and a weekly notification that always says the
# same thing is one the reader stops opening. So a free arithmetic pass decides
# who is worth asking about, and only those tickets reach the model.
buy_check_sweep:
  enabled: true

  # Escalate to the agent when the live price is within this much of the buy
  # case's own price trigger. 5% is roughly one ordinary week of movement in a
  # small/mid-cap name: close enough that the answer could change before the
  # next sweep, far enough that ordinary noise does not summon the model.
  near_trigger_pct: 5.0

  # Escalate when the company has reported since the last sweep, whatever the
  # price is doing. Most event triggers in a buy case are written against
  # reported figures, so a fresh report is the moment their answer can change —
  # and it is the one moment a price-only filter would miss entirely.
  escalate_on_new_earnings: true

  # Do not re-notify about the same standing recommendation. Without this, a
  # trigger that fires and stays fired sends the same alert every week until it
  # is trained into background noise.
  suppress_repeat_alerts: true

  # A ceiling on how many tickers may reach the model in one sweep, so a market
  # -wide drop cannot turn one scheduled job into an unbounded bill. Tickers are
  # escalated closest-to-trigger first, so the ceiling drops the least urgent.
  max_agent_checks_per_sweep: 8

  # Say something after this many consecutive sweeps in which a buy case's price
  # trigger could not be read as a dollar amount.
  #
  # Such a trigger ("below 8.0x forward earnings") is legitimate and the sweep
  # handles it correctly by escalating to the model — but that name then never
  # becomes free to check, and costs ~$0.08 every week for as long as the
  # document stands. Nothing self-corrects: regenerating the buy case against a
  # live quote is a human action (`python buy_case.py TICKER`).
  #
  # Three rather than one, because the usual cause is a quote that failed on the
  # day the case was written, and a single occurrence is not yet a pattern worth
  # interrupting anybody over. Alerted ONCE when the streak is reached, not
  # weekly after — the whole point is to avoid a message that repeats until it
  # is ignored.
  warn_after_unreadable_sweeps: 3

tools:
  web_search:
    default_engine: "tavily"
    search_depth: "advanced"                  # 'basic' (1 credit) or 'advanced' (2 credits)
    time_range: "year"                        # recency window for results
    max_results: 5

database:
  enabled: true
  connection_string_env: "DATABASE_URL" # e.g., postgresql://user:pass@localhost:5432/investing_db
  embedding_model: "text-embedding-004"
  vector_dimension: 768

# Read-only Flask report viewer (webapp/). Decoupled from the agent: it reads its
# OWN webapp/.env at runtime (DATABASE_URL, PORT) — this block documents its shape,
# it is not loaded by the app. See specs/webapp.feature & agent_architecture.md §9.
webapp:
  default_port: 8000                        # webapp/.env PORT overrides; binds 0.0.0.0
  render_markdown: "server"                 # python-markdown -> HTML, no CDN/JS dep
  browse_modes:
    - name: "by_ticker"                     # pick ticker -> pick run -> Bear/Bull/Final
      source_table: "ticker_runs"
    - name: "by_pipeline_run"               # pick run -> all tickers A-Z with verdicts
      source_table: "ticker_runs"           # grouped by run_id (HAVING count > 1)
      multi_ticker_only: true                # exclude single-ticker on-demand one-offs
      csv_export: true                       # Ticker,Company,Recommendation download

# LLM pricing used to estimate per-run spend from actual token usage (USD per 1M
# tokens), keyed by the RESOLVED model version reported by the API — not by the
# alias configured on the agents.
#
# Why keyed by resolved version rather than by the configured model: the agents
# USED to run on the moving alias `gemini-flash-latest`, which Google repointed
# from Gemini 2.5 Flash to gemini-3.6-flash — a flat price here went stale the
# moment it moved, understating real spend ~2.4x. agents.model is now pinned, but
# pricing still keys off what the API reports it actually billed, so a pin that
# does not match the billed model is caught rather than assumed away.
#
# `event.model_version` gives the concrete model per response, so every run is
# priced against what was actually billed. An unpriced model is logged as a loud
# warning and its cost recorded as unknown rather than silently priced at zero or
# at some other model's rate.
#
# Thinking models bill `thoughtsTokenCount` at the OUTPUT rate. Those tokens are
# already folded into the output counter, so no separate line is needed here.
llm_pricing:
  models:
    # Derived from Cloud Billing SKU lines, 2026-07-27 (exact, not published-rate
    # guesswork): input $1.184282 / 789,522 tok; output $1.013594 / 135,146 tok;
    # cached input $0.031888 / 212,609 tok. All three divide out to round numbers.
    gemini-3.6-flash:
      input_usd_per_1m: 1.50
      output_usd_per_1m: 7.50
      # Gemini bills repeated prompt prefixes as a separate, cheaper SKU. The API's
      # promptTokenCount INCLUDES these, so full-rate input = prompt - cached.
      # Ignoring this overstates cost: cached ran 21% of prompt tokens at 1/10 rate.
      cached_input_usd_per_1m: 0.15
      confirmed: true
    gemini-2.5-flash:
      input_usd_per_1m: 0.30
      output_usd_per_1m: 2.50
      cached_input_usd_per_1m: 0.075
      confirmed: true
    # Zero because it is billed by SUBSCRIPTION, not per token — an Ollama plan is a
    # flat monthly fee, so the marginal cost of a critic turn really is $0 and the
    # run total should say so.
    #
    # It has to be listed rather than left out. An absent model makes `_model_price`
    # log "No price configured ... reported spend is too low" on every run, and a
    # cost guard that cries wolf is one people stop reading. Listed-at-zero says
    # "this was priced, deliberately, and the answer is nothing"; absent says "we do
    # not know". Those are different claims and the log should not conflate them.
    #
    # What is NOT free is the knock-on: a noisy critic raises BLOCKING findings that
    # trigger revision rounds, and the reviser runs on Gemini at full rate. Watch
    # refinement rounds, not this line, to see what a critic swap really costs.
    # Keyed by the name ADK reports on the event (`model_version`), which for a
    # LiteLLM-routed model is the full "provider/model" string, not the bare
    # model id. Verified against a live call rather than assumed: the bare
    # "glm-5.2:cloud" silently failed to match and logged "No price configured".
    "ollama_chat/glm-5.2:cloud":
      input_usd_per_1m: 0.0
      output_usd_per_1m: 0.0
      cached_input_usd_per_1m: 0.0
      confirmed: true
  # Embeddings are billed per input token. Four vectors are generated per ticker
  # (bear, bull, sale, final report), previously uncounted.
  #
  # NOTE: text-embedding-004 is RETIRED — the current API 404s on it. Calls were
  # failing silently and every stored vector was zeros, so no embedding SKU has
  # ever appeared on a bill. gemini-embedding-001 replaces it (3072 dims by
  # default, pinned to 768 to match the vector(768) schema). The rate below is a
  # placeholder: re-calibrate once an embedding SKU shows up in Cloud Billing.
  embedding:
    model: "gemini-embedding-001"
    input_usd_per_1m: 0.15
    confirmed: false

# Tavily web-search pricing (USD per 1,000 searches) for per-run cost estimates.
# Tavily bills per credit ($0.008/credit on Pay-as-you-go); an 'advanced' search
# = 2 credits, so ~$16 per 1,000 searches. The free 'Researcher' tier includes
# 1,000 credits/month (actual $ = 0 until exhausted).
search_pricing:
  tavily_usd_per_1k: 16.00

rate_limits:
  fmp_starter:
    max_calls_per_minute: 300
    delay_between_calls_seconds: 0.20 # Guarantees ~5 calls/sec max
  sec_edgar:
    max_calls_per_second: 10
    delay_between_calls_seconds: 0.12 # Guarantees ~8 calls/sec max
    # SEC EDGAR requires a descriptive User-Agent carrying a real contact
    # address, so the value is inherently personal and does not belong in a
    # public file. It is read from the environment instead — see .env.example,
    # and mcp_server.py:195, which is what actually sets it.
    #
    # Named the same way as `database.connection_string_env`: this file records
    # the NAME of the variable, never its contents. The literal address that
    # used to sit here was dead config — nothing has ever loaded this key.
    user_agent_env: "SEC_USER_AGENT"   # e.g. "Your Name your.email@example.com"
  tavily_search:
    delay_between_calls_seconds: 0.5

screening_parameters:
  min_market_cap: 100000000  # $100 Million minimum
  universe_limit: 5000        # Max companies to pull from the FMP screener universe (raise to capture more mid/small caps)

  # --- Greenblatt's step-by-step screen ---------------------------------------
  # "The Little Book That Still Beats the Market", step-by-step appendix. These are
  # ELIGIBILITY GATES, not the ranking: ranking stays on the real Magic Formula
  # (Return on Capital + Earnings Yield). The book's DIY steps use Return on ASSETS
  # and a plain P/E because those are what a free screener gives you; they are
  # coarser proxies, so they are applied here as filters over the same universe.
  #
  # Set any of these to null to disable that gate.

  # Step 1: "screen for ROA of at least 20%".
  min_roa: 0.20
  # Which ROA the 20% hurdle is measured against:
  #   "ebit"       - EBIT / Total Assets. Pre-tax, pre-interest: the same numerator
  #                  as ROC and Earnings Yield, so the whole pipeline stays on one
  #                  basis and ROA vs ROC is an apples-to-apples comparison of
  #                  denominators (all assets vs only capital employed).
  #   "net_income" - Net Income / Total Assets. What a retail screener reports, and
  #                  what Greenblatt's readers would have typed 25% into. Materially
  #                  stricter than "ebit" (tax and interest come out of the numerator).
  # Both are computed and written to the CSV either way; this only picks the gate.
  roa_basis: "ebit"

  # Step 1b: reject candidates trading within this fraction of their 52-week high.
  # A HARD gate, not a soft flag: a stock sitting at its 52-week high is a poor
  # ENTRY even when it is a good, cheap, growing business (the PLMR/WLDN/ICHR/MXL
  # pattern — all bought near the high, sold at a loss near the bottom). The
  # 52-week high/low come straight from the FMP screener universe response, so this
  # costs no extra API call. Set to null to disable.
  max_pct_from_52w_high: 0.10

  # Step 2: "eliminate all companies that have P/E ratios less than 5".
  # NOTE the direction: a P/E BELOW 5 is an earnings yield ABOVE 1/5 (20%). Greenblatt
  # drops these not because they are expensive but because a P/E that low is usually a
  # data error or a one-off event (an asset sale, a legal settlement) inflating a single
  # year's earnings — not repeatable profit. Companies with no positive earnings have no
  # meaningful P/E and are not dropped by this gate (they are already gone: negative EBIT
  # is rejected earlier).
  min_pe: 5.0

  # --- Peter Lynch's PEG test ("One Up on Wall Street") -----------------------
  # NOT part of Greenblatt's screen. Added because his two ratios are silent on
  # GROWTH: a high earnings yield on flat or shrinking earnings is precisely the
  # value trap the Magic Formula buys by design and leaves the basket to average
  # out. Lynch divides the P/E by the earnings growth rate, so a company counts as
  # cheap only relative to how fast it is compounding.
  #
  # This one is BOTH a gate and a ranking factor: survivors are ranked on 1/PEG
  # alongside ROC and earnings yield (Composite_Score = ROC_Rank + EY_Rank + PEG_Rank).
  #
  # Growth rate = (EPS_latest_FY / EPS_FY_minus_N) ** (1/N) - 1, from ANNUAL filings.
  # PEG = P/E divided by the growth rate in PERCENTAGE POINTS (a P/E of 20 with 20%
  # growth is a PEG of 1.0). Set either threshold to null to disable that half.

  # Minimum compound annual EPS growth. 0.0 means "must be growing at all" —
  # anything flat or shrinking is dropped. Unlike the ROA/PE gates, a company whose
  # growth CANNOT be computed is also dropped (it has not demonstrated growth, and
  # 1/PEG is a ranking input so a survivor without one cannot be ranked). The run
  # prints the reasons split out so a provider outage is visible as a count.
  min_eps_growth: 0.0

  # Lynch's fair-value line is PEG = 1.0. 1.5 allows a premium for a company that is
  # already clearing a 25% ROA hurdle.
  #
  # Raised from 1.2 on evidence, not taste. Over a 189-company cross-sector sample,
  # the companies sitting in the 1.2-1.5 band were NMRK, JNJ, VMC, KDP, MCK, MPLX,
  # OKE, CMG and ISRG — 8.7% to 29.2% growth, zero loss years in the window, and NOT
  # ONE of them there because its growth rate had been capped. The speculative
  # high-growth cohort does not live in that band at all: capped growth plus a low
  # multiple already puts it well under 1.2. So 1.2 was excluding quality, not
  # excluding risk. See §10.I of specs/agent_architecture.md.
  max_peg: 1.5

  # Length of each growth window, in fiscal years.
  eps_growth_years: 3

  # How the growth rate is measured:
  #   "sums"     - CAGR of the last N years' TOTAL EPS vs the PRIOR N years' total.
  #                Uses every year in a 2N-year window, so a loss year inside it is
  #                counted at its real negative value instead of being stepped over,
  #                and a one-off spike is diluted rather than annualised. Needs 2N
  #                annual filings, so it excludes more recent listings.
  #   "endpoint" - the plain two-point CAGR (EPS_now / EPS_N_years_ago) ^ (1/N) - 1.
  #
  # "sums" is the default because the endpoint form is driven entirely by which two
  # years the calendar happens to pick. On the sample it cut the median growth of the
  # supposed >50% growers from 66.1% to 41.8% (AU 111%->17%, IBM 84%->21%) while
  # leaving real compounders high (NVDA 207%->132%), and it RESCUED companies a
  # single weak endpoint year had wrongly disqualified (no-growth rejections 56->42).
  eps_growth_method: "sums"

  # Ceiling on the growth rate the PEG DIVIDES BY — not on the rate reported, and not
  # on the "is it growing at all" gate, both of which use the measured figure.
  #
  # Grounded in measured persistence. Companies in the sample that had been
  # compounding at >50%/yr went on to deliver a MEDIAN of -20.4% over the next three
  # years, with 73% going outright negative (the >100% cohort: 75% negative). The
  # 95th percentile of actually-realised 3-year EPS CAGR is 63%. So a denominator
  # much above 60% prices in growth that the data says almost never arrives.
  #
  # Capping can only ever RAISE a PEG (a worse rank), so it cannot flatter a company.
  # NOTE it also implies a hard P/E ceiling for the whole screen of
  # max_peg x max_growth_rate_for_peg x 100 = 90 at these defaults.
  # Set to null to divide by the raw rate instead.
  max_growth_rate_for_peg: 0.60

  # The base window must have been a REAL trading period, not a breakeven one.
  #
  # This is the targeted fix for the problem the cap above only blunts. An absolute
  # dollar floor on EPS is meaningless across price levels, so the test is net margin
  # over the base window instead — scale-free and comparable across sectors. GRND's
  # base year made $852K on $195M of revenue: a 0.4% margin, technically profitable
  # and economically breakeven, and a denominator that turns any recovery into a
  # three-digit growth rate.
  #
  # Sample distribution of base-window net margin: p25 4.3%, p50 10.5%, p90 28.1%.
  # 3% sits below the ordinary range while clearing genuine compounders comfortably
  # (NVDA 16.2%, LLY 21.9%).
  #
  # Deliberately NOT "base EPS as a share of the company's own peak EPS": that
  # measure scored NVDA at 3.5% (its trough year) and would have thrown out the best
  # compounder in the sample. Set to null to disable.
  min_base_net_margin: 0.03

  # Step 3: "eliminate companies that have announced earnings in the last week".
  # A fresh report has not been absorbed into the price yet, so the screen would be
  # ranking on figures the market is still digesting. Checked against FMP's earnings
  # calendar. Set to null (or 0) to skip the check entirely.
  exclude_recent_earnings_days: 7

  # Step 4: "eliminate all utilities and financial stocks" and "eliminate all foreign
  # companies (ADRs)". Sector is the coarse cut; industry catches the financials that
  # FMP files under other sectors (and REITs, already handled separately).
  excluded_sectors:
    - "Financial Services"
    - "Financial"
    - "Utilities"
    - "Banking"
  # Matched as case-insensitive substrings against the FMP `industry` field.
  excluded_industries:
    - "bank"                  # Banks - Regional / Diversified
    - "insurance"             # Insurance - Life / Property & Casualty / Brokers
    - "asset management"
    - "capital markets"
    - "financial conglomerate"
    - "financial data"
    - "shell companies"       # SPACs: no operating business to measure
    - "mortgage"
    - "closed-end fund"       # mutual-fund-like vehicles
    - "exchange traded fund"
    - "reit"                  # also filtered explicitly; listed here for completeness
  # Foreign issuers. `country` already restricts the FMP screener query to US, but ADRs
  # of foreign operating companies can still slip through with a US-registered profile,
  # so the company NAME is checked for the depositary-receipt markers too.
  exclude_adr: true
  allowed_countries:
    - "US"
