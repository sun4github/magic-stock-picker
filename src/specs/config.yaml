# Master Configuration for Google ADK Agent System

system:
  project_name: "Magic Formula Skeptical Decomposer Engine"
  environment: "development"
  framework: "google-adk" # Google Agent Development Kit

logging:
  console_output: true
  log_level: "INFO"
  log_directory: "logs"
  filename_pattern: "run_{timestamp}.log"

agents:
  screener_agent:
    name: "Magic_Formula_Screener"
    top_n_candidates: 30
    script_path: "magic_formulae_screener.py"

  # NOTE: SEC 10-K and FMP metrics are gathered by DIRECT tool calls (no LLM) for
  # 100% fidelity; there are no sec/metrics LLM agents. Phase B reasoning is a
  # SequentialAgent of three roles: bear -> bull -> neutral analyst.

  bear_agent:
    name: "Bear_Agent"
    model: "gemini-flash-latest"              # thinking model (genuine research)
    instructions_file: "research-instructions.md"
    # Two complementary search sources (see agent_architecture.md Section 2C):
    news_provider: "fmp"                      # ticker-tagged factual news
    news_api_key_env: "FMP_API_KEY"
    search_provider: "tavily"                 # qualitative open-web (bear framing)
    search_api_key_env: "TAVILY_API_KEY"

  bull_agent:
    name: "Bull_Agent"
    model: "gemini-flash-latest"              # runs after bear; Section 4 refutes it
    instructions_file: "bullish-research-instructions.md"
    news_provider: "fmp"
    news_api_key_env: "FMP_API_KEY"
    search_provider: "tavily"                 # qualitative open-web (bull framing)
    search_api_key_env: "TAVILY_API_KEY"

  analyst_agent:
    name: "Analyst_Agent"                     # neutral judge (no skeptical prompt)
    model: "gemini-flash-latest"              # weighs bull vs bear -> Buy/Watch/Avoid
    output_format: "markdown"

  sale_advisor_agent:
    name: "Sale_Advisor_Agent"
    model: "gemini-flash-latest"              # Phase C: defines the thesis-breaking sell triggers
    instructions_file: "sale-advisor-instructions.md"
    news_provider: "fmp"
    news_api_key_env: "FMP_API_KEY"
    search_provider: "tavily"                 # qualitative open-web (adverse events)
    search_api_key_env: "TAVILY_API_KEY"

  # On-demand sell-condition check (Phase C follow-up). A standalone single-stock
  # flow: loads the ticker's latest SALE_CASE and tests whether its conditions are
  # now met against CURRENT data, advising Sell/Hold. Not part of the analysis graph.
  sell_check_agent:
    name: "Sell_Check_Agent"
    model: "gemini-flash-latest"
    news_provider: "fmp"                      # current developments (impairments, contract loss)
    news_api_key_env: "FMP_API_KEY"
    search_provider: "tavily"                 # anything not in the news feed
    search_api_key_env: "TAVILY_API_KEY"

tools:
  web_search:
    default_engine: "tavily"
    search_depth: "advanced"                  # 'basic' (1 credit) or 'advanced' (2 credits)
    time_range: "year"                        # recency window for results
    max_results: 5

database:
  enabled: true
  connection_string_env: "DATABASE_URL" # e.g., postgresql://user:pass@localhost:5432/investing_db
  embedding_model: "text-embedding-004"
  vector_dimension: 768

# Read-only Flask report viewer (webapp/). Decoupled from the agent: it reads its
# OWN webapp/.env at runtime (DATABASE_URL, PORT) — this block documents its shape,
# it is not loaded by the app. See specs/webapp.feature & agent_architecture.md §9.
webapp:
  default_port: 8000                        # webapp/.env PORT overrides; binds 0.0.0.0
  render_markdown: "server"                 # python-markdown -> HTML, no CDN/JS dep
  browse_modes:
    - name: "by_ticker"                     # pick ticker -> pick run -> Bear/Bull/Final
      source_table: "ticker_runs"
    - name: "by_pipeline_run"               # pick run -> all tickers A-Z with verdicts
      source_table: "ticker_runs"           # grouped by run_id (HAVING count > 1)
      multi_ticker_only: true                # exclude single-ticker on-demand one-offs
      csv_export: true                       # Ticker,Company,Recommendation download

# LLM pricing used to estimate per-run spend from actual token usage.
# Update these to the current Google AI pricing for your model/tier (USD per 1M tokens).
llm_pricing:
  input_usd_per_1m: 0.30
  output_usd_per_1m: 2.50

# Tavily web-search pricing (USD per 1,000 searches) for per-run cost estimates.
# Tavily bills per credit ($0.008/credit on Pay-as-you-go); an 'advanced' search
# = 2 credits, so ~$16 per 1,000 searches. The free 'Researcher' tier includes
# 1,000 credits/month (actual $ = 0 until exhausted).
search_pricing:
  tavily_usd_per_1k: 16.00

rate_limits:
  fmp_starter:
    max_calls_per_minute: 300
    delay_between_calls_seconds: 0.20 # Guarantees ~5 calls/sec max
  sec_edgar:
    max_calls_per_second: 10
    delay_between_calls_seconds: 0.12 # Guarantees ~8 calls/sec max
    user_agent: "Suneel MagicStockPicker/1.0 (suneel.kanuri@gmail.com)"
  tavily_search:
    delay_between_calls_seconds: 0.5

screening_parameters:
  min_market_cap: 100000000  # $100 Million minimum
  universe_limit: 2500        # Max companies to pull from the FMP screener universe (raise to capture more mid/small caps)
  excluded_sectors:
    - "Financial Services"
    - "Financial"
    - "Utilities"
    - "Banking"